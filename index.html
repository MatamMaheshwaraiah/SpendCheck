<!doctype html>
<html lang="en-IN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Apply the saved / system theme before first paint (prevents a flash) -->
    <script>
      (function () {
        var p = "system";
        try { p = localStorage.getItem("spendcheck.theme") || "system"; } catch (e) {}
        var t = p === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : p;
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <meta name="theme-color" content="#0e1122" />
    <meta name="description" content="SpendCheck — AI-powered personal finance tracker with receipt scanning, smart categorisation and needs-vs-wants budgeting." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Type: Fraunces (soft variable serif, headlines + AI notes) · Geist (UI, tabular figures) · Geist Mono (receipts only) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>SpendCheck — Know where every rupee goes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
